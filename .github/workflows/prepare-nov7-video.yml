name: Prepare approved November 7 video
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-nov7-video.yml
permissions:
  contents: write
concurrency:
  group: instagram-reviewed-publish
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Reconstruct exact approved MP4 and register queue
        shell: python
        run: |
          import base64, hashlib, json
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path.cwd()))
          from daily_instagram import validate_content
          manifest = json.loads(Path("posting/prepared/salt-on-the-wind-20261107.reconstruction.json").read_text())
          source = Path(manifest["source"]).read_bytes()
          assert hashlib.sha256(source).hexdigest() == manifest["source_sha256"]
          data = b"".join(base64.b64decode(s["data"], validate=True) if "data" in s else source[s["offset"]:s["offset"]+s["length"]] for s in manifest["segments"])
          assert hashlib.sha256(data).hexdigest() == manifest["target_sha256"]
          draft_path = Path("posting/drafts/salt-on-the-wind-dj-yokai-20261107.json")
          draft = json.loads(draft_path.read_text())
          item = draft["queue_item"]
          assert item["path"] == manifest["target"]
          assert item["sha256"] == manifest["target_sha256"]
          assert item["scheduled_date"] == "2026-11-07"
          validate_content(item)
          queue_path = Path("posting/queue.json")
          queue = json.loads(queue_path.read_text())
          state = json.loads(Path("posting/state.json").read_text())
          assert item["id"] not in state.get("items", {}), "Already claimed or published"
          existing = [i for i in queue if i["id"] == item["id"]]
          if existing:
              assert existing == [item], "Conflicting queue item"
          else:
              assert not any(i.get("sha256") == item["sha256"] for i in queue), "Duplicate video"
              queue.append(item)
          Path(item["path"]).write_bytes(data)
          queue_path.write_text(json.dumps(queue, ensure_ascii=False, indent=2) + "\n")
          draft["status"] = "scheduled"
          draft["blocker"] = None
          draft["verification"] = "Exact MP4 SHA256 verified; original approved video packets preserved; audio listening review not performed."
          draft_path.write_text(json.dumps(draft, ensure_ascii=False, indent=2) + "\n")
          print("Verified SHA256:", item["sha256"])
          print("Scheduled:", item["id"], item["scheduled_date"])
      - name: Run existing publishing tests
        run: python3 -m unittest discover -s tests -v
      - name: Commit video and scheduled queue atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posting/videos/salt-on-the-wind-dj-yokai-20261107.mp4 posting/queue.json posting/drafts/salt-on-the-wind-dj-yokai-20261107.json
          if ! git diff --cached --quiet; then
            git commit -m "Schedule approved Salt on the Wind Reel and Story for November 7"
            git push origin HEAD:main
          fi
