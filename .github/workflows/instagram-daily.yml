name: EZAWA238 Daily Instagram
on:
  schedule:
    - cron: '30 8 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/instagram-daily.yml
      - daily_instagram.py
      - daily_story.py
permissions:
  contents: write
concurrency:
  group: instagram-reviewed-publish
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_LOGIN_METHOD: ${{ vars.IG_LOGIN_METHOD || secrets.IG_LOGIN_METHOD }}
      IG_API_VERSION: ${{ vars.IG_API_VERSION || secrets.IG_API_VERSION }}
      IG_EXPECTED_USERNAME: ezawa238
    steps:
      - uses: actions/checkout@v5
      - name: Check existing publishing tests
        run: python3 -m unittest discover -s tests -v
      - name: Publish next approved Reel or check connection on push
        run: python3 daily_instagram.py

      - name: Share approved video to Stories or check account eligibility
        run: python3 daily_story.py
